<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/logo/Monograma-LM-con-hilo-y-aguja.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Textil L&M - Plataforma Integral de Control de Producción y Tejeduría" />
    <title>Textil L&M • Plataforma Integral de Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body class="h-full bg-[#F3F4F8] dark:bg-[#0B0F17] text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-secondary selection:text-white transition-colors duration-300">
    <div id="root" class="h-full">
      <div id="initial-splash" style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif;">
        <div style="position: relative; width: 80px; height: 80px; border-radius: 24px; background: #ffffff; padding: 10px; box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1); border: 2px solid rgba(255, 255, 255, 0.9); display: flex; align-items: center; justify-content: center;">
          <img src="/images/logo/Monograma-LM-con-hilo-y-aguja.webp" alt="Textil L&M" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div style="text-align: center; margin-top: 18px;">
          <h2 style="margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -0.025em;" class="splash-title">Textil L&amp;M</h2>
          <p style="margin: 6px 0 0; font-size: 12px; font-weight: 600; color: #10b981; letter-spacing: 0.025em;">Cargando sistema...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
